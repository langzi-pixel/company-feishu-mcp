name: company-feishu-mcp
services:
  mcp:
    image: ${FEISHU_MCP_IMAGE:?Set FEISHU_MCP_IMAGE to the verified image tag}
    container_name: company-feishu-mcp
    restart: unless-stopped
    stop_grace_period: 40s
    env_file:
      - path: ${FEISHU_MCP_ENV_FILE:?Set FEISHU_MCP_ENV_FILE to the private environment file}
        format: raw
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - type: bind
        source: ${FEISHU_MCP_DATA_DIR:?Set FEISHU_MCP_DATA_DIR to the private persistent data directory}
        target: /data
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+process.env.PORT+process.env.BASE_PATH+'/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
